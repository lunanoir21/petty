[package]
name = "petty"
version = "0.1.0"
edition = "2021"
description = "Petty -- pet + tty: a hand-drawn pixel-art pet that lives in your terminal"
repository = "https://github.com/lunanoir21/petty"
license = "MIT"
build = "build.rs"

# The crate is "petty" but the command stays short: `pet overlay`, `pet stop`.
[[bin]]
name = "pet"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
